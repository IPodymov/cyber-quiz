<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — CyberQuiz</title>
    <meta name="description" content="Войдите в аккаунт CyberQuiz.">
    <meta name="theme-color" content="#0b0620">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="/css/styles.css">
    <script type="module" src="/js/auth.js"></script>
</head>
<body>
<main id="main">
    <div class="container">
        <form class="card card-glow auth-card" data-auth-form="login" novalidate>
            <h1>Вход</h1>
            <div class="alert" role="alert" data-form-error hidden></div>
            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" autocomplete="email" required
                       aria-describedby="email-error">
                <span class="field-error" id="email-error" data-error-for="email"></span>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                       aria-describedby="password-error">
                <span class="field-error" id="password-error" data-error-for="password"></span>
            </div>
            <button class="btn btn-primary btn-lg" style="width:100%" type="submit">Войти</button>
            <p class="muted" style="margin:16px 0 0;text-align:center">Нет аккаунта? <a href="/register.html">Зарегистрироваться</a>
            </p>
        </form>
    </div>
</main>
</body>
</html>
